[package]
name = "worldometer-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for browsing worldometers.info statistics"
default-run = "worldo-tui"

[lib]
name = "worldo_tui"
path = "src/lib.rs"

[[bin]]
name = "worldo-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
insta = "1"

[profile.release]
lto = true
strip = true
